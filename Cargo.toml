[package]
name = "sumi-workstation"
version = "1.1.0"
edition = "2024"
rust-version = "1.91"
description = "Native cross-platform Rust financial charting & trading workstation"
license = "MIT OR Apache-2.0"

[lib]
name = "sumi_workstation"
path = "src/lib.rs"

[[bin]]
name = "sumi-workstation"
path = "src/main.rs"

[dependencies]
egui = "0.36.0"
eframe = { version = "0.36.0", features = ["persistence"] }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
png = "0.18"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
