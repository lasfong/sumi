[workspace]
resolver = "3"
members = [
    "crates/sumi-core",
    "crates/sumi-data",
    "crates/sumi-desktop",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
hex = "0.4"
log = "0.4.27"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
