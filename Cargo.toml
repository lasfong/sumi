[workspace]
resolver = "3"
members = [
    "crates/sumi-core",
    "crates/sumi-data",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
