[package]
name = "sumi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sumi v2.0 Supercharts Desktop Application (Tauri v2 + sumi-core + sumi-data)"

[lib]
name = "sumi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "sumi-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
hex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sumi-core = { path = "../sumi-core" }
sumi-data = { path = "../sumi-data" }
sumi-yumeko-bridge = { path = "../sumi-yumeko-bridge" }
sumi-cli = { path = "../sumi-cli" }
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
