[package]
name = "sumi-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cache-first pure-Rust market data provider (TradingView rustls-tls, SQLite OHLCV store, CafeF bulk importer) for Sumi v2.0"

[lib]
name = "sumi_data"
path = "src/lib.rs"

[[bin]]
name = "sumi-data-cli"
path = "src/bin/sumi-data-cli.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sumi-core = { path = "../sumi-core" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tradingview-rs = { git = "https://github.com/vnquants/tradingview-rs", rev = "5794fe4", default-features = false, features = ["rustls-tls"] }
url = "2"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.30"
