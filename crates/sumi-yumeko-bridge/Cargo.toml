[package]
name = "sumi-yumeko-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only QMV Top-Down Yumeko <-> Sumi bridge, wire-identical yumeko_sumi_contract_v1 DTOs, kVND<->VND Scale Guard, and KT01 evidence exporter"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sumi-core = { path = "../sumi-core" }
sumi-data = { path = "../sumi-data" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
